<!DOCTYPE html>
<html lang="{{ current_lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ t('app_name') }} — {{ t('tagline') }}{% endblock %}</title>
  
  <!-- Favicon / Logo -->
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/logo.svg') }}">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom Application Styling -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/udaan.css') }}">
  
  {% block extra_head %}{% endblock %}
</head>
<body>
  <!-- Demo Mode Indicator Banner -->
  {% include 'components/demo_banner.html' %}

  <!-- Primary Navigation -->
  {% include 'components/navbar.html' %}

  <!-- Flash Alerts -->
  {% include 'components/alerts.html' %}

  <!-- Main View Content -->
  <main class="flex-grow-1" id="main-content">
    {% block content %}{% endblock %}
  </main>

  <!-- Site Footer -->
  {% include 'components/footer.html' %}

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <!-- Chart.js for Impact Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.2/dist/chart.umd.min.js"></script>
  <!-- Application Client Scripts -->
  <script src="{{ url_for('static', filename='js/udaan.js') }}"></script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
